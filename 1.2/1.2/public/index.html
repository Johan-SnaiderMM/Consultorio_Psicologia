<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login Consultorio Psicológico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Demo del sistema de gestión de un consultorio psicológico: lista de espera, citas sin cruces e historiales en PDF. Datos ficticios." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Vista previa al compartir el enlace (LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="es_CO" />
  <meta property="og:site_name" content="Consultorio de Psicología" />
  <meta property="og:title" content="Consultorio de Psicología · demo" />
  <meta property="og:description" content="Citas sin cruces, lista de espera e historiales en PDF para un consultorio psicológico. Datos ficticios." />
  <meta property="og:url" content="https://consultorio-psicologia-demo.vercel.app/" />
  <meta property="og:image" content="https://consultorio-psicologia-demo.vercel.app/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="627" />
  <meta property="og:image:alt" content="Consultorio de Psicología: citas, lista de espera e historiales en PDF" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fuentes y estilos -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Mulish&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" type="image/png" href="./assets/psicologia.png" />
  <link rel="stylesheet" href="./Frontend/index.css" />

  <!-- Google Identity Services - Carga controlada -->
  <script>
    function handleGoogleLoaded() {
      document.dispatchEvent(new Event('google-loaded'));
    }
  </script>
  <script 
    src="https://accounts.google.com/gsi/client" 
    onload="handleGoogleLoaded()"
    async 
    defer>
  </script>
</head>

<body style="background-image: url('assets/Fondo.jpg'); background-size: cover; background-position: center; background-attachment: fixed;">

  <!-- Spinner de carga -->
  <div
    id="loadingSpinner"
    style="display: none;"
    role="alert"
    aria-live="assertive"
  >
    <div class="loading-bar"></div>
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <main class="form-wrapper">
    <section class="form-side">
      <a title="Logo">
        <img
          src="./assets/Logo.png"
          class="logo"
          alt="Logo del Consultorio Psicológico"
        />
      </a>

      <!-- Contenedor de error -->
      <div id="error-message" role="alert" aria-live="assertive"></div>

      <form class="my-form">
        <div class="form-welcome-row">
          <h1>Iniciar sesión</h1>
        </div>

        <!-- Botón de Google -->
        <div class="socials-row">
          <div id="buttonDiv"></div>
          <!-- Solo en la demo en línea: script.js lo muestra cuando /api/modo dice que es la demo -->
          <div id="demo-entrada" style="display: none; text-align: center;">
            <button
              type="button"
              onclick="entrarDemo()"
              style="padding: 10px 28px; border: 0; border-radius: 6px; background: #1f6f8b; color: #fff; font-weight: 700; cursor: pointer;"
            >
              Probar la demo
            </button>
            <p style="font-size: 0.9em; margin-top: 0.75rem;">
              Todos los datos son ficticios y se reinician solos.
            </p>
          </div>
        </div>

        <div class="divider">
          <div class="divider-line"></div>
          <span style="color: black; font-weight: bold; font-size: 1.2em;">
            ಠ_ಠ
          </span>
          <div class="divider-line"></div>
        </div>

        <p>
          Bienvenidos a la lista de espera del consultorio de psicología.
        </p>
      </form>
    </section>

    <aside class="info-side">
      <img
        src="./assets/consultorio.png"
        alt="Imagen del consultorio"
        class="mockup"
      />
    </aside>
  </main>

  <!-- Script principal -->
  <script src="script.js" defer></script>
  <script src="./demo-banner.js" defer></script>
</body>
</html>
